<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bilbbet</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b1b1b">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" href="assets/icons/icon-192.png">
</head>
<body style="margin:0;background:#1b1b1b;">
<div class="bb-side-banner bb-side-banner-left">
  <span class="bb-side-banner-fallback">BILBBET</span>
  <img src="assets/logos/bilby-logo.png" alt="" onerror="this.style.display='none';"/>
</div>
<div class="bb-content-frame">
  <div id="app" style="font-family:system-ui,sans-serif;color:#f5f5f5;padding-bottom:180px;"></div>
</div>
<div class="bb-side-banner bb-side-banner-right">
  <span class="bb-side-banner-fallback">BILBBET</span>
  <img src="assets/logos/bilby-logo.png" alt="" onerror="this.style.display='none';"/>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => {
        console.warn('Service worker registration failed (non-fatal):', err);
      });
    });
  }
</script>
</body>
</html>
