<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilbbet — Home</title>
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; height: 100%; }
  iframe { display: block; width: 100%; height: 100%; border: none; min-height: 900px; }
</style>
</head>
<body>
<!--
  This file is a thin wrapper only -- the real, live content lives in the
  main app itself (index.html?embed=home), not here. That was a deliberate
  choice: an embed built from a *copy* of the Home tab's logic could
  silently drift out of sync with the real site over time (different
  featured picks, different odds, different everything) as the main app
  changes. An iframe of the actual live page can't drift, because it IS
  the live page.

  This file's own URL is left unchanged on purpose -- the Eliza Cup site's
  embed code already points at this exact file, so keeping it here (just
  pointing it somewhere new inside) means their embed keeps working with
  no changes needed on their end.
-->
<iframe src="https://bilbo443.github.io/BILBBET/index.html?embed=home" title="Bilbbet — Home"></iframe>
</body>
</html>
