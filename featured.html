<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilbbet — This Week's Value</title>
<style>
  :root {
    --bg: #1a1a1a;
    --card: #232323;
    --border: #333333;
    --gold: #ffdd00;
    --text: #f5f5f5;
    --muted: #9a9a9a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .wrap {
    padding: 16px;
    max-width: 480px;
  }
  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .brand {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--gold);
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4a9166;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .headline {
    font-size: 13px;
    color: var(--muted);
    margin: 4px 0 14px;
  }
  .pick {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .pick:last-of-type { border-bottom: none; }
  .pick-info { min-width: 0; }
  .pick-team {
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pick-market {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .pick-odds {
    font-family: 'SF Mono', Consolas, monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--gold);
    flex-shrink: 0;
  }
  .footer {
    margin-top: 16px;
    text-align: center;
  }
  .cta {
    display: inline-block;
    background: var(--gold);
    color: #1a1a1a;
    font-weight: 700;
    font-size: 12px;
    padding: 9px 18px;
    border-radius: 4px;
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  .fineprint {
    margin-top: 10px;
    font-size: 10px;
    color: #6a6a6a;
    line-height: 1.5;
  }
  .empty, .error {
    padding: 30px 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <span class="brand">BILBBET</span>
    <span class="live"><span class="live-dot"></span>Live</span>
  </div>
  <div class="headline">This week's best value across the Eliza Cup</div>
  <div id="picks"><div class="empty">Loading&hellip;</div></div>
  <div class="footer">
    <a class="cta" href="https://bilbo443.github.io/BILBBET/" target="_blank" rel="noopener noreferrer">See full odds &amp; place a bet &rarr;</a>
    <div class="fineprint">Odds shown are a live snapshot and may have moved since this page loaded. Refreshes automatically every few minutes.</div>
  </div>
</div>
<script>
(function(){
  var DATA_URL = 'https://bilbo443.github.io/BILBBET/data/futures.json';
  var REFRESH_MS = 3 * 60 * 1000;

  // Only positive, aspirational outcomes belong in a public-facing feature
  // -- "odds to finish last" is technically a value bet too, but not
  // something worth putting front and centre on the league's own site.
  var MARKET_LABELS = {
    win_div_pct: 'Win Division', top3_pct: 'Top 3 Finish',
    promotion_pct: 'Promotion', roddy_win_pct: 'Roddy Winner'
  };
  var MIN_PCT = 8, MAX_PCT = 25; // a real, non-trivial chance -- not a near-certainty, not a hopeless longshot

  function impliedPct(odds){ return 100 / (odds * 1.05); }

  function renderPicks(picks){
    var el = document.getElementById('picks');
    if(!picks.length){
      el.innerHTML = '<div class="empty">No standout value picks right now -- check back soon.</div>';
      return;
    }
    el.innerHTML = picks.map(function(p){
      return '<div class="pick">' +
        '<div class="pick-info">' +
          '<div class="pick-team">' + escapeHtml(p.team) + '</div>' +
          '<div class="pick-market">' + escapeHtml(p.market) + ' &middot; ' + escapeHtml(p.division) + '</div>' +
        '</div>' +
        '<div class="pick-odds">' + p.odds.toFixed(2) + '</div>' +
      '</div>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function load(){
    fetch(DATA_URL, {cache: 'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(futures){
      var candidates = [];
      Object.keys(futures.divisions || {}).forEach(function(div){
        var markets = futures.divisions[div];
        Object.keys(MARKET_LABELS).forEach(function(key){
          (markets[key] || []).forEach(function(r){
            if(r.suspended) return;
            var pct = impliedPct(r.odds);
            if(pct >= MIN_PCT && pct <= MAX_PCT){
              candidates.push({team: r.team, market: MARKET_LABELS[key], division: div.replace(' (D1)',''), odds: r.odds, pct: pct});
            }
          });
        });
      });
      if(futures.roddy && futures.roddy.roddy_win_pct){
        futures.roddy.roddy_win_pct.forEach(function(r){
          if(r.suspended) return;
          var pct = impliedPct(r.odds);
          if(pct >= MIN_PCT && pct <= MAX_PCT){
            candidates.push({team: r.team, market: 'Roddy Winner', division: 'Open field', odds: r.odds, pct: pct});
          }
        });
      }
      candidates.sort(function(a,b){ return b.odds - a.odds; });
      renderPicks(candidates.slice(0, 6));
    }).catch(function(e){
      document.getElementById('picks').innerHTML = '<div class="error">Couldn\\'t load odds right now -- try again shortly.</div>';
    });
  }

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
