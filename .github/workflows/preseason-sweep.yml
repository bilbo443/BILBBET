name: Pre-season Roster Sweep

# Checks each Tuesday before kickoff. An October daily trigger runs a final
# full sweep only on the day before Round 1 in round_dates.json; other
# October days stop before installing dependencies or fetching the sheet.
#
# This is diagnostic-only: it never writes to data/, never opens a PR, and
# never auto-corrects anything it finds. A clean run produces nothing
# visible at all. An issues-found run opens a GitHub Issue with the report
# -- a human decides what (if anything) needs fixing from there, the same
# "never guess, always ask" rule as every other check in this pipeline.
on:
  schedule:
    - cron: '0 5 * * 2'  # ~3pm Tuesday AEST / ~4pm Tuesday AEDT -- adjust to your own timezone
    - cron: '0 5 * 10 *' # daily October date gate; one final full sweep
  workflow_dispatch:
    inputs:
      sheet_url:
        description: 'Published CSV URL for the results sheet (leave blank to use the saved SHEET_URL variable)'
        required: false
        type: string
      today:
        description: 'Override "today" as YYYY-MM-DD, for testing the skip logic without waiting for a real Tuesday.'
        required: false
        type: string

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check whether a sweep is due
        id: due
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          with open('data/round_dates.json') as stream:
              start = date.fromisoformat(json.load(stream)['1'])
          today = date.today()
          schedule = os.environ.get('SCHEDULE')
          final_trigger = schedule == '0 5 * 10 *'
          eve = start - timedelta(days=1)
          due = today == eve if final_trigger else (today < start and today != eve if schedule else True)
          print(f"{'Final' if final_trigger else 'Regular'} sweep {'due' if due else 'skipped'}; season starts {start}.")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_check={str(due).lower()}\n")
          PY

      - name: Set up Python
        if: steps.due.outputs.run_check == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.due.outputs.run_check == 'true'
        run: pip install pandas numpy requests

      - name: Run the sweep
        if: steps.due.outputs.run_check == 'true'
        id: sweep
        env:
          RESOLVED_SHEET_URL: ${{ inputs.sheet_url || vars.SHEET_URL }}
          RESOLVED_ALLTIME_URL: ${{ vars.ALLTIME_URL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$RESOLVED_SHEET_URL" ]; then
            echo '## Roster sweep could not complete' > sweep-report.md
            echo 'SHEET_URL is missing. Set the published results-sheet URL and rerun this check before kickoff.' >> sweep-report.md
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY_ARG=""
          if [ -n "${{ inputs.today }}" ]; then
            TODAY_ARG="--today ${{ inputs.today }}"
          fi
          EVE_ARG=""
          if [ "$SCHEDULE" = '0 5 * 10 *' ]; then EVE_ARG="--only-on-eve"; fi
          set +e
          python pipeline/preseason_roster_sweep.py \
            --sheet-url "$RESOLVED_SHEET_URL" \
            --alltime-url "$RESOLVED_ALLTIME_URL" \
            --roster-path data/h2h_divisions.json \
            --schedule-path data/h2h_schedule.json \
            --coeffs-path data/team_market_coeffs.json \
            --history-path data/roddy_history.json \
            --futures-path data/futures.json \
            --shift-path data/h2h_shift.json \
            --cup-shift-path data/h2h_cup_shift.json \
            --widen-path data/h2h_variance_widen.json \
            --h2h-history-path data/h2h_history.json \
            --round-dates-path data/round_dates.json \
            --report-path sweep-report.md \
            $EVE_ARG \
            $TODAY_ARG > sweep-output.log 2>&1
          sweep_status=$?
          set -e
          cat sweep-output.log
          if [ "$sweep_status" -ne 0 ] && [ ! -s sweep-report.md ]; then
            echo '## Roster sweep could not complete' > sweep-report.md
            echo '' >> sweep-report.md
            echo 'The sweep stopped before it could write its normal report. Inspect the Run the sweep step in this GitHub Actions run for the error.' >> sweep-report.md
          fi
          echo "exit_code=$sweep_status" >> "$GITHUB_OUTPUT"
        # exit code 0: clean or skipped (season already started) -- either
        # way, nothing to surface. exit code 1: genuine issues found.
        # Captured explicitly rather than letting a non-zero exit fail the
        # job outright, since "issues found" is an expected, valid outcome
        # this workflow needs to act on, not a script crash.

      - name: Open an issue if anything was flagged
        if: steps.due.outputs.run_check == 'true' && steps.sweep.outputs.exit_code != '0'
        run: |
          gh issue create \
            --title "Pre-season roster sweep -- issues found ($(date +%Y-%m-%d))" \
            --body-file sweep-report.md
        env:
          GH_TOKEN: ${{ github.token }}
