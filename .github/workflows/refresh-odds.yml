name: Weekly Odds Refresh (draft, manual trigger only)

# Deliberately workflow_dispatch only -- NOT scheduled. This is intentional,
# not an oversight: the sheet's author test-runs scores before the season
# starts (confirmed during development -- the calendar-consistency check
# in Layer 2 catches this correctly), and a scheduled/unattended trigger
# would risk treating test data as a real result. Someone has to press the
# button on purpose.
on:
  workflow_dispatch:
    inputs:
      sheet_url:
        description: 'Published CSV URL for the results sheet'
        required: true
        type: string
      header_row:
        description: 'Header row index in the CSV (0-based)'
        required: false
        default: '1'
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run the pipeline (fetch -> validate -> extract -> simulate -> draft)
        id: pipeline
        run: |
          python pipeline/run_refresh.py \
            --sheet-url "${{ inputs.sheet_url }}" \
            --header-row "${{ inputs.header_row }}" \
            --roster-path data/h2h_divisions.json \
            --round-dates-path data/round_dates.json \
            --live-futures-path data/futures.json \
            --draft-dir draft \
            --pr-body-path draft/pr-body.md
        # Non-zero exit here (fetch failure, validation failure) stops the
        # workflow before the PR step below ever runs -- see run_refresh.py's
        # own exit-code logic, which is what this depends on.

      - name: Open a PR with the draft odds
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Weekly odds refresh (draft) - ${{ github.run_id }}"
          body-path: draft/pr-body.md
          branch: odds-refresh/${{ github.run_id }}
          add-paths: |
            draft/odds-draft-*.json
            draft/extracted-*.json
            draft/run-report-*.json
          commit-message: "Draft odds refresh from weekly sheet pull"
          # This PR is the "draft" -- merging it is the explicit publish
          # step (Layer 6). Nothing here writes to data/ directly.
